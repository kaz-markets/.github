name: okf org index

# One page across the decentralized bundles. Each repository keeps its own
# docs/INDEX.md; this collects them so there is still a single answer.
#
# Reads private repositories with the OKF_TOKEN secret (a fine-grained PAT with
# Contents: read on the kaz-markets repositories). Without it, private bundles
# are skipped.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect each repository's index
        env:
          GH_TOKEN: ${{ secrets.OKF_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repos="kaz-socket prediction-markets-report kaz-control"
          rm -rf okf/repos
          mkdir -p okf/repos
          rows=""
          for repo in $repos; do
            if gh api "repos/kaz-markets/$repo/contents/docs/INDEX.md" \
                 -H "Accept: application/vnd.github.raw" \
                 > "okf/repos/$repo.md" 2>/dev/null; then
              count="$(grep -c '^| \[' "okf/repos/$repo.md" || true)"
              rows="${rows}| [$repo](https://github.com/kaz-markets/$repo) | ${count} | [docs/INDEX.md](repos/$repo.md) |"$'\n'
            else
              rm -f "okf/repos/$repo.md"
              rows="${rows}| [$repo](https://github.com/kaz-markets/$repo) | - | not readable |"$'\n'
            fi
          done

          {
            echo "<!-- Generated by .github/workflows/org-index.yml. Do not edit. -->"
            echo
            echo "# KAZ knowledge index"
            echo
            echo "Each repository owns its own bundle under \`docs/\`. These are the copies as of the last run."
            echo
            echo "| Repository | Docs | Index |"
            echo "| --- | --- | --- |"
            printf '%s' "$rows"
          } > okf/README.md

      - name: Commit if it moved
        run: |
          set -euo pipefail
          git config user.name "kaz-markets bot"
          git config user.email "bot@kaz.markets"
          if git diff --quiet -- okf; then
            echo "okf org index: unchanged"
            exit 0
          fi
          git add okf
          git commit -m "Refresh the org knowledge index"
          git push
