name: pages

# Publishes the `updates/` directory as the site root. Every kaz-update page is a
# static folder under `updates/<slug>/`; og.png and robots.txt sit at the root.
# The site is unlisted: pages are noindex, slugs are unguessable, robots disallows.

on:
  push:
    branches: [main]
    paths:
      - "updates/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: updates
      - id: deployment
        uses: actions/deploy-pages@v4
