name: okf sync

# Rolls the org OKF files into the repositories in sync/repos.json, as pull
# requests. Dispatch only: it never runs on its own.
#
# Needs the OKF_TOKEN secret, a fine-grained PAT with Contents: read and write
# and Pull requests: write on the repositories in the manifest.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report what would change without pushing.
        type: boolean
        default: false
      repo:
        description: One repository name, or empty for every repository in the manifest.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fan out
        env:
          GH_TOKEN: ${{ secrets.OKF_TOKEN }}
        run: |
          set -euo pipefail
          args=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
          if [ -n "${{ inputs.repo }}" ]; then args+=("--repo=${{ inputs.repo }}"); fi
          node scripts/sync.mjs "${args[@]}"
