name: python ci

# Reusable. A repository calls it with:
#
#   jobs:
#     ci:
#       uses: kaz-markets/.github/.github/workflows/python-ci.yml@main
#       with:
#         working-directory: .
#
# Installs a Python package, lints and format-checks it with ruff, then runs
# pytest. AGENTS.md makes Python the default for new backend work, so this is
# the counterpart to node-ci.yml.
#
# The ruff version is pinned here rather than in the repository, so the standard
# is one place. The rules live in the synced ruff.toml at the repository root.
#
# A repository with a uv.lock installs from it with `uv sync --locked`, which fails
# when the lock and pyproject.toml disagree, so CI resolves the tree a developer
# does. One with a .python-version runs on that version. A repository with neither
# keeps the previous behaviour: the python-version input and a pip install.

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to run on.
        type: string
        default: "3.12"
      working-directory:
        description: Package directory, relative to the repository root.
        type: string
        default: "."

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: ${{ hashFiles(format('{0}/.python-version', inputs.working-directory)) == '' }}
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.working-directory }}/pyproject.toml

      - uses: actions/setup-python@v5
        if: ${{ hashFiles(format('{0}/.python-version', inputs.working-directory)) != '' }}
        with:
          python-version-file: ${{ inputs.working-directory }}/.python-version

      - name: Install
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.16.10"
          if [ -f uv.lock ]; then
            python -m pip install "uv==0.12.5"
            uv sync --locked --extra dev
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          else
            python -m pip install -e ".[dev]" || python -m pip install -e .
          fi

      - name: Lint
        working-directory: ${{ inputs.working-directory }}
        run: ruff check .

      - name: Format
        working-directory: ${{ inputs.working-directory }}
        run: ruff format --check .

      - name: Test
        working-directory: ${{ inputs.working-directory }}
        run: python -m pytest -q
